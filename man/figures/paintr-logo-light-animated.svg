<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="173.205" height="200" viewBox="0 0 173.205 200" role="img" aria-label="paintr">
  <title>paintr</title>
  <desc>Two inks on cream stock. A three-by-six matrix is printed in graphite and black, every cell holding its value. A fluorescent pink highlight is printed over row 2 and column 6, one plate out of register. The wordmark paintr IS row 2, one letter to a cell. Where the pink row crosses the pink column both inks hit 100 percent, and the letter r is knocked out of that solid cell in bare stock. The matrix and all of its values stay on the sheet throughout; only the pink is applied, a roller travelling left to right along the row and then down the column, the overprint developing immediately behind the advancing edge.</desc>

  <style>
    .ink-row, .clip-row { animation: sweep-row 8.5s infinite; }
    .ink-col, .clip-col { animation: sweep-col 8.5s infinite; }
    .bead-row { animation: bead-row-move 8.5s infinite; }
    .bead-col { animation: bead-col-move 8.5s infinite; }
    .bead-row-fx { animation: bead-row-fade 8.5s infinite; }
    .bead-col-fx { animation: bead-col-fade 8.5s infinite; }

    /* THE STROKE, in four beats, on 8.5s.
       TOUCH DOWN  1.4-2.8%   The roller lands on the 3 units of plate that overhang the
                              frame — the slip's own overhang, pink in the final artwork.
       LOAD        2.8-4.4%   It sits there. 0.14s of nothing is what gives the pull that
                              follows a body to move.
       PULL       4.4-20.5%   1.37s at about 90 units a second, decelerating through the
                              last cell and a half. p, a, i, n, t take the ink one at a
                              time. The last thing the roller sets down on is the solid
                              cell — the one the r is knocked out of.
       LIFT      88.6-94.2%   The roller carries the ink off the far end: the LEFT edge
                              chases the right one out, so x + width stays pinned at 145.6
                              and the paint leaves in the direction it arrived. The r is
                              the last cell to give its paint up, as it was the last to
                              take it.
       No overshoot in the geometry, on purpose: overshooting would print pink outside the
       approved plate, and retracting would flash bare stock inside a cell. The weight
       lives in the easing and in the bead. */
    @keyframes sweep-row {
      0%     { x: 19.6px;  width: 0px;    animation-timing-function: linear; }
      1.4%   { x: 19.6px;  width: 0px;    animation-timing-function: cubic-bezier(.25,.9,.3,1); }
      2.8%   { x: 19.6px;  width: 3.2px;  animation-timing-function: linear; }
      4.4%   { x: 19.6px;  width: 3.2px;  animation-timing-function: cubic-bezier(.5,.02,.14,1); }
      20.5%  { x: 19.6px;  width: 126px;  animation-timing-function: linear; }
      88.6%  { x: 19.6px;  width: 126px;  animation-timing-function: cubic-bezier(.45,0,.85,.35); }
      94.2%  { x: 145.6px; width: 0px;    animation-timing-function: linear; }
      94.3%  { x: 19.6px;  width: 0px; }
      100%   { x: 19.6px;  width: 0px; }
    }

    /* The second stroke: shorter, down the column, a beat after the first lands. Same
       roller, same speed, so it reads as the same hand. It lifts first: last plate on,
       first plate off. */
    @keyframes sweep-col {
      0%     { y: 53px;  height: 0px;   animation-timing-function: linear; }
      22.4%  { y: 53px;  height: 0px;   animation-timing-function: cubic-bezier(.25,.9,.3,1); }
      23.8%  { y: 53px;  height: 2.6px; animation-timing-function: linear; }
      25.2%  { y: 53px;  height: 2.6px; animation-timing-function: cubic-bezier(.5,.02,.14,1); }
      37.5%  { y: 53px;  height: 90px;  animation-timing-function: linear; }
      87.2%  { y: 53px;  height: 90px;  animation-timing-function: cubic-bezier(.45,0,.85,.35); }
      92.8%  { y: 143px; height: 0px;   animation-timing-function: linear; }
      92.9%  { y: 53px;  height: 0px; }
      100%   { y: 53px;  height: 0px; }
    }

    /* The bead is translated by exactly the distance the stroke has laid, on exactly the
       stroke's timing function, so its dense end sits ON the advancing edge. It is clipped
       by that same edge, so it can never outrun the paint it is laying. It outlives the
       stroke by 0.13s: ink pools where the roller stopped, then it dries. */
    @keyframes bead-row-move {
      0%     { transform: translateX(0px);   animation-timing-function: linear; }
      1.4%   { transform: translateX(0px);   animation-timing-function: cubic-bezier(.25,.9,.3,1); }
      2.8%   { transform: translateX(3.2px); animation-timing-function: linear; }
      4.4%   { transform: translateX(3.2px); animation-timing-function: cubic-bezier(.5,.02,.14,1); }
      20.5%  { transform: translateX(126px); }
      100%   { transform: translateX(126px); }
    }
    @keyframes bead-col-move {
      0%     { transform: translateY(0px);   animation-timing-function: linear; }
      22.4%  { transform: translateY(0px);   animation-timing-function: cubic-bezier(.25,.9,.3,1); }
      23.8%  { transform: translateY(2.6px); animation-timing-function: linear; }
      25.2%  { transform: translateY(2.6px); animation-timing-function: cubic-bezier(.5,.02,.14,1); }
      37.5%  { transform: translateY(90px); }
      100%   { transform: translateY(90px); }
    }
    @keyframes bead-row-fade {
      0%, 1.4%   { opacity: 0; }
      2.8%, 17%  { opacity: .9; }
      22%, 100%  { opacity: 0; }
    }
    @keyframes bead-col-fade {
      0%, 22.4%  { opacity: 0; }
      23.8%, 34% { opacity: .9; }
      39%, 100%  { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ink-row, .ink-col, .clip-row, .clip-col,
      .bead-row, .bead-col, .bead-row-fx, .bead-col-fx { animation: none; }
    }
  </style>

  <defs>
    <clipPath id="op-hex">
      <path d="M86.6025 0 L173.205 50 L173.205 150 L86.6025 200 L0 150 L0 50 Z"/>
    </clipPath>

    <!-- One rect per clipPath. Two rects in one clipPath would XOR and punch a hole
         exactly where the pink row crosses the pink column. These are the pink plate's
         footprint AFTER the slip: everything the pink ink covers. They are the SAME two
         rects as the pink plate itself, and they are wiped by the same keyframe tracks,
         so ink and overprint share one advancing edge and cannot drift apart. -->
    <clipPath id="op-row"><rect class="clip-row" x="19.6" y="83" width="126" height="30"/></clipPath>
    <clipPath id="op-col"><rect class="clip-col" x="124.6" y="53" width="21" height="90"/></clipPath>

    <linearGradient id="g-bead-row" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#FA4E96" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#E03B80" stop-opacity="0.3"/>
      <stop offset="1"    stop-color="#B22A64" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="g-bead-col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FA4E96" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#E03B80" stop-opacity="0.3"/>
      <stop offset="1"    stop-color="#B22A64" stop-opacity="0.82"/>
    </linearGradient>

    <!-- The second impression is three plates, so each can be re-printed in its own
         overprint colour where the pink ink already sits underneath it. -->

    <!-- PLATE 1: the cell rules. Hairline. Light enough that they separate the letters of
         row 2 without amputating the word. -->
    <g id="op-rules">
      <g fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M44.6 55V145 M65.6 55V145 M86.6 55V145 M107.6 55V145 M128.6 55V145"/>
        <path d="M23.6 85H149.6 M23.6 115H149.6"/>
      </g>
    </g>

    <!-- PLATE 2: the matrix border. Heavier, but still short of the full ink, so the one
         solid cell stays the only solid mass in the grid. -->
    <g id="op-frame">
      <rect x="23.6" y="55" width="126" height="90" fill="none" stroke="currentColor" stroke-width="2.6"/>
    </g>

    <!-- PLATE 3: the ink. Values, wordmark, and the solid selected cell. -->
    <g id="op-ink">
      <rect x="128.6" y="85" width="21" height="30" fill="currentColor"/>

      <g fill="currentColor" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" font-weight="400" letter-spacing="0" text-anchor="middle">
        <text x="34.1"  y="75.8">4</text>
        <text x="76.1"  y="75.8">9</text>
        <text x="97.1"  y="75.8">1</text>
        <text x="118.1" y="75.8">7</text>
        <text x="139.1" y="75.8">3</text>

        <text x="34.1"  y="135.8">6</text>
        <text x="55.1"  y="135.8">5</text>
        <text x="76.1"  y="135.8">8</text>
        <text x="97.1"  y="135.8">2</text>
        <text x="118.1" y="135.8">4</text>
        <text x="139.1" y="135.8">1</text>
      </g>

      <!-- The wordmark IS row 2, one glyph to a cell. The r is absent from this plate: it
           is knocked out of the solid cell instead. -->
      <g fill="currentColor" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="0" text-anchor="middle">
        <text x="34.1"  y="106.2">p</text>
        <text x="55.1"  y="106.2">a</text>
        <text x="76.1"  y="106.2">i</text>
        <text x="97.1"  y="106.2">n</text>
        <text x="118.1" y="106.2">t</text>
      </g>
    </g>
  </defs>

  <g clip-path="url(#op-hex)">
    <!-- the stock -->
    <rect x="0" y="0" width="173.205" height="200" fill="#F3EDE0"/>

    <!-- THE PAINT. Fluorescent pink, hung 4 left and 2 up of where it should be — the slip
         is in the coordinates, not in a transform, so these rects ARE the clip rects above.
         This is highlight_data(m, rows = 2, columns = 6), and it is the only thing on the
         sticker that moves: it is rolled on, it holds, it is carried off. -->
    <g class="op-paint">
      <rect class="ink-row" x="19.6"  y="83" width="126" height="30" fill="#FA4E96"/>
      <rect class="ink-col" x="124.6" y="53" width="21"  height="90" fill="#FA4E96"/>

      <g clip-path="url(#op-row)">
        <g class="bead-row"><g class="bead-row-fx" opacity="0">
          <rect x="1.6" y="83" width="18" height="30" fill="url(#g-bead-row)"/>
        </g></g>
      </g>
      <g clip-path="url(#op-col)">
        <g class="bead-col"><g class="bead-col-fx" opacity="0">
          <rect x="124.6" y="39" width="21" height="14" fill="url(#g-bead-col)"/>
        </g></g>
      </g>
    </g>

    <!-- THE DATA. Never animated, never faded, never absent. Every rule, every value, the
         NA, the wordmark and the r are on the sheet at every frame of the cycle — a cell
         that blinks empty is a cell that reads as missing, and this package exists to make
         missingness visible, not to manufacture it. Note that not one of these elements
         carries a class: there is no selector that could reach them. -->
    <use xlink:href="#op-rules" href="#op-rules" color="#565460"/>
    <use xlink:href="#op-frame" href="#op-frame" color="#3C3A46"/>
    <use xlink:href="#op-ink"   href="#op-ink"   color="#1B1A21"/>

    <!-- paint_matrix() prints NA in the hot colour. It is a VALUE, not a highlight, so it
         sits on the sheet from the first frame. Placed where the pink plate's slip leaves
         it: optically centred in its cell, riding 2 units high. -->
    <text x="55.1" y="73.8" fill="#FA4E96"
          font-family="Menlo, Consolas, 'Courier New', monospace"
          font-size="14" font-weight="700" letter-spacing="0" text-anchor="middle">NA</text>

    <!-- THE OVERPRINT. The same three plates, reprinted in their overprint colours wherever
         the ink now has pink underneath it. It develops immediately behind the roller,
         because it is gated by the roller's own edge: #op-row and #op-col are wiped by the
         same keyframes as the pink rects. p, a, i, n, t darken one at a time as the paint
         reaches them. -->
    <g class="op-over">
      <g clip-path="url(#op-row)">
        <use xlink:href="#op-rules" href="#op-rules" color="#541A39"/>
        <use xlink:href="#op-frame" href="#op-frame" color="#3B1229"/>
        <use xlink:href="#op-ink"   href="#op-ink"   color="#22101C"/>
      </g>
      <g clip-path="url(#op-col)">
        <use xlink:href="#op-rules" href="#op-rules" color="#541A39"/>
        <use xlink:href="#op-frame" href="#op-frame" color="#3B1229"/>
        <use xlink:href="#op-ink"   href="#op-ink"   color="#22101C"/>
      </g>
    </g>

    <!-- THE SIGNATURE. The r takes no ink at all, in the one cell that takes 100% of both.
         Static: knocked out of the solid cell whether the paint is down or not, so the last
         element of row 2 is never missing either. -->
    <text x="139.1" y="106.2" fill="#F3EDE0"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="24" font-weight="700" letter-spacing="0" text-anchor="middle">r</text>

    <!-- The die line. Stroke centred on a path inset by half its own width, so the outer
         edge of the ink lands exactly on the cut. Not printed: cut. -->
    <path d="M86.6025 4.6188 L169.205 52.3094 L169.205 147.6906 L86.6025 195.3812 L4 147.6906 L4 52.3094 Z"
          fill="none" stroke="#22101C" stroke-width="8"/>
  </g>
</svg>
