url: https://r-pkg.thecoatlessprofessor.com/paintr/
template:
  bootstrap: 5
  light-switch: true

reference:
- title: Painters
  desc: >
    Draw an R data structure as a picture, one function per structure. Each page
    documents both backends: a base-graphics painter (`paint_*()`, drawn to the
    current device) and a ggplot2 painter (`gpaint_*()`, returning a ggplot
    object). Under every cell the painter writes the expression you would type to
    reach that value.
  contents:
  - paint_vector
  - paint_matrix
  - paint_data_frame
  - paint_list
  - paint_array
- title: Highlighting
  desc: Mark specific cells for a painter to fill.
  contents:
  - highlight_data
- title: Sizing
  desc: >
    Estimate the device size a structure needs so its text stays above the
    legibility floor.
  contents:
  - paint_size
